<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia Fortia | Acceso</title>
  <link rel="icon" type="image/png" href="logo-fortia.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #272B46;
      --navy-dark: #1C1F35;
      --gold: #DCB668;
      --gold-light: #EBCB7E;
      --white: #FFFFFF;
      --text-soft: #B9BCD0;
      --error: #F08A7E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at 50% 30%, #30355A 0%, var(--navy) 45%, var(--navy-dark) 100%);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .access {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      width: 240px;
      max-width: 70%;
      display: block;
      margin: 0 auto 8px;
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 0.9rem;
      color: var(--text-soft);
      margin-bottom: 32px;
    }

    form {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(220, 182, 104, 0.35);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: left;
      backdrop-filter: blur(4px);
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .field { margin-bottom: 20px; position: relative; }

    input {
      width: 100%;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--white);
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #password { padding-right: 80px;
    }
    input::placeholder { color: #7F8399; }
    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(220, 182, 104, 0.2);
    }

    .toggle {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: none;
      border: none;
      color: var(--text-soft);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .toggle:hover { color: var(--gold); }

    button[type="submit"] {
      width: 100%;
      padding: 15px;
      margin-top: 4px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--navy-dark);
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(220, 182, 104, 0.3);
    }

    .error {
      display: none;
      margin-top: 16px;
      font-size: 0.88rem;
      color: var(--error);
      text-align: center;
    }

    .footer {
      margin-top: 28px;
      font-size: 0.78rem;
      color: #7F8399;
    }
  </style>
</head>
<body>
  <main class="access">
    <img src="logo-fortia.png" alt="Fortia" class="logo">
    <p class="subtitle">Academia</p>
    <p class="tagline">Tu ruta para vender IUL en una semana</p>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="name">Nombre del agente</label>
        <input type="text" id="name" placeholder="Escribe tu nombre completo" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Contraseña de la academia" required>
        <button type="button" class="toggle" id="toggle">Mostrar</button>
      </div>
      <button type="submit">Entrar a la academia</button>
      <p class="error" id="error">Contraseña incorrecta. Inténtalo de nuevo.</p>
    </form>

    <p class="footer">© Fortia · Material exclusivo para agentes</p>
  </main>

  <script>
    // Huella (SHA-256) de la contraseña de la academia.
    // Para cambiar la contraseña, reemplaza este valor por la huella de la nueva.
    const PASSWORD_HASH = "95bc4d1fd2010b8206f8e6b42d1e7bf25e46d676737a0db6f18c9ce1d1057068";

    // Si el agente ya entró en esta sesión, pasa directo al inicio
    if (sessionStorage.getItem("fortiaAgent")) {
      window.location.href = "inicio.html";
    }

    async function sha256(text) {
      const data = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    const toggle = document.getElementById("toggle");
    const passInput = document.getElementById("password");
    toggle.addEventListener("click", () => {
      const hidden = passInput.type === "password";
      passInput.type = hidden ? "text" : "password";
      toggle.textContent = hidden ? "Ocultar" : "Mostrar";
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const pass = passInput.value;
      const error = document.getElementById("error");

      if (await sha256(pass) === PASSWORD_HASH) {
        sessionStorage.setItem("fortiaAgent", name);
        window.location.href = "inicio.html";
      } else {
        error.style.display = "block";
        passInput.value = "";
        passInput.focus();
      }
    });
  </script>
</body>
</html>
